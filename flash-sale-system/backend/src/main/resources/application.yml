server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/flashsale}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cache:
    type: redis

jwt:
  secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyReplaceMeInProduction1234567890}
  expiration-ms: 86400000

admin:
  email: ${ADMIN_EMAIL:admin@flashsale.local}
  password: ${ADMIN_PASSWORD:admin123}

flashsale:
  reservation:
    timeout-seconds: 60
  payment:
    success-probability: 0.9

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.flashsale: DEBUG
